[package]
name = "aurora"
version = "0.1.7"
edition = "2024"

[workspace]
members = [
  ".",
  "plugins/aurora-vst",
  "plugins/aurora-vst/xtask",
  "lab/preset-studio",
]
resolver = "2"

[dependencies]
bevy = { version = "0.17", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_camera",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_gltf",
  "bevy_image",
  "bevy_log",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_render",
  "bevy_scene",
  "bevy_shader",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "png",
  # Remote Figure assets entered in the controls console.
  "http",
  "https",
  # Scene/type registry helpers if any path still spawns reflected scenes.
  "reflect_auto_register",
  "webgpu",
  # With `default-features = false`, bevy_winit does not forward winit's X11 stack;
  # host `cargo check` on Linux would hit winit's unsupported-platform stub.
  "x11",
] }
wasm-bindgen = "0.2.122"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
