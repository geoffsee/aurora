[package]
name = "preset-studio"
version = "0.1.0"
edition = "2024"
publish = false
description = "Preset Studio — host Bevy look-dev (3D stage + pack GPU materials)"

[[bin]]
name = "preset-studio"
path = "src/main.rs"

[dependencies]
# Match root aurora Bevy 0.17 feature set for host GPU (not wasm).
bevy = { version = "0.17", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_camera",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_image",
  "bevy_log",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_render",
  "bevy_shader",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "png",
  "webgpu",
  "x11",
] }
