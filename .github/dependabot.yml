version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    assignees:
      - "geoffsee"
    # `typescript-legacy` is an npm alias (`npm:typescript@…`); Dependabot
    # looks up the alias name on the registry, gets 404, and fails the whole
    # bun update job even when other bumps succeed.
    ignore:
      - dependency-name: "typescript-legacy"
    groups:
      bun-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      bun-major:
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    assignees:
      - "geoffsee"
    # Bevy majors need a human migration PR (API breaks); Dependabot bumps
    # stay conflicted/red and block the weekly unstick loop.
    ignore:
      - dependency-name: "bevy"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      cargo-major:
        patterns:
          - "*"
        update-types:
          - "major"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    assignees:
      - "geoffsee"
    # Private sibling actions are not reachable by Dependabot's updater and
    # turn the whole github-actions job red even when public Action bumps land.
    ignore:
      - dependency-name: "geoffsee/helios-action"
      - dependency-name: "geoffsee/caretta-autopilot-action"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
