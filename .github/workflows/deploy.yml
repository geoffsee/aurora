name: Deploy

# Publishes projector, controls, and Preset Studio to GitHub Pages.
# Note: GH Pages can only host the static front-end. The OSC/WebSocket
# bridge in bridge/index.ts requires a local Bun server and is not deployed.
# Studio "Publish to Console" uses BroadcastChannel + localStorage on the
# same origin so authored packages reach Console/projector without the bridge.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  WASM_BINDGEN_VERSION: "0.2.122"
  SOUNDCLOUD_API_URL: ${{ vars.SOUNDCLOUD_API_URL }}
  AURORA_LIVE_API_URL: ${{ vars.AURORA_LIVE_API_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build WASM (web target)
        run: bun run build:web

      - name: Build controls app
        run: bun run build:controls

      - name: Build mobile show client
        run: bun run build:mobile

      - name: Build WebXR spatial visualizer
        run: bun run build:webxr

      - name: Build Preset Studio
        run: bun run build:studio

      - name: Build live-show directory
        run: bun run build:shows

      - name: Stage static site
        run: |
          set -euo pipefail
          cp web/index.html web/styles.css dist/
          # Shaders only — do NOT `cp -r assets` (assets/models is a symlink to
          # models/ and would dump local-only multi‑MB packs or a broken link).
          mkdir -p dist/assets/shaders
          cp -R assets/shaders/. dist/assets/shaders/
          # Web-safe glTF pack only (ship:true in models/manifest.json, ~5 MB).
          bun run scripts/stage-web-models.ts
          # Bundled mode catalog + precompiled CompiledModeWire for static Pages
          # (controls launchpad + projector field-runtime without the Bun bridge).
          bun run scripts/stage-static-mode-catalog.ts
          test -f dist/api/modes/catalog.json
          # In dev, the Bun server serves web/ plus the root dist/pkg bundle so the HTML imports
          # `./dist/pkg/aurora.js`. In the Pages bundle, HTML and WASM sit
          # together, so the WASM lives at `./pkg/aurora.js`.
          sed -i 's|./dist/pkg/|./pkg/|g' dist/index.html
          sed -i 's|./dist/projector-bridge.js|./projector-bridge.js|g' dist/index.html
          sed -i 's|./dist/vendor/|./vendor/|g' dist/index.html
          # `build:controls` writes the React controls bundle to dist/controls/.
          test -f dist/controls/index.html
          if [ -n "${SOUNDCLOUD_API_URL}" ]; then
            sed -i "s|__AURORA_SOUNDCLOUD_API_URL__|${SOUNDCLOUD_API_URL}|g" dist/controls/index.html
          else
            sed -i "s|__AURORA_SOUNDCLOUD_API_URL__||g" dist/controls/index.html
          fi
          if [ -n "${AURORA_LIVE_API_URL}" ]; then
            sed -i "s|__AURORA_LIVE_API_URL__|${AURORA_LIVE_API_URL}|g" dist/controls/index.html
            sed -i "s|__AURORA_LIVE_API_URL__|${AURORA_LIVE_API_URL}|g" dist/shows/index.html
          else
            sed -i "s|__AURORA_LIVE_API_URL__||g" dist/controls/index.html
            sed -i "s|__AURORA_LIVE_API_URL__||g" dist/shows/index.html
          fi
          # Mobile show client — same ControlsProvider, touch-first view.
          test -f dist/mobile/index.html
          # Immersive spatial visualizer. The directory form is the canonical Pages URL.
          test -f dist/webxr/index.html
          # Preset Studio static app (package authoring + BroadcastChannel publish).
          test -f dist/studio/index.html
          test -f dist/shows/index.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
