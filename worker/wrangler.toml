name = "aurora-relay"
main = "src/index.ts"
compatibility_date = "2025-05-01"
# Required for the WebSocket Hibernation API used by ShowSession.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SHOW_SESSION"
class_name = "ShowSession"

[[durable_objects.bindings]]
name = "SHOW_DIRECTORY"
class_name = "ShowDirectory"

[[durable_objects.bindings]]
name = "PAIRING_CODE"
class_name = "PairingCode"

[[durable_objects.bindings]]
name = "SOUNDCLOUD_ACCOUNT"
class_name = "SoundCloudAccount"

# SQLite-backed Durable Objects — available on the Workers free plan, unlike the
# older key-value backed classes which require a paid plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShowSession", "PairingCode"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SoundCloudAccount"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ShowDirectory"]

[[r2_buckets]]
binding = "LIVE_SHOW_ASSETS"
bucket_name = "aurora-live-show-assets"
preview_bucket_name = "aurora-live-show-assets-preview"

# Built by `bun run build:viewer`. The Worker serves these only below
# `/viewer/`, isolating executable audience packages from Pages Console data.
[assets]
directory = "../dist/viewer"
binding = "VIEWER_ASSETS"
run_worker_first = true
