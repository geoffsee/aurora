name = "aurora-relay"
main = "src/index.ts"
compatibility_date = "2025-05-01"
# Required for the WebSocket Hibernation API used by ShowSession.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SHOW_SESSION"
class_name = "ShowSession"

[[durable_objects.bindings]]
name = "PAIRING_CODE"
class_name = "PairingCode"

[[durable_objects.bindings]]
name = "SOUNDCLOUD_ACCOUNT"
class_name = "SoundCloudAccount"

# SQLite-backed Durable Objects — available on the Workers free plan, unlike the
# older key-value backed classes which require a paid plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShowSession", "PairingCode"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SoundCloudAccount"]
